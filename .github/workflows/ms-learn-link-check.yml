name: Documentation Link Validation

on:
  workflow_dispatch: # Manual trigger for a full external link scan
  pull_request:
    paths:
      - '**/*.md'
      - '.github/scripts/check-docs.ps1'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check-docs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check metadata, internal links, anchors, and style
        shell: pwsh
        run: ./.github/scripts/check-docs.ps1

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check

      - name: Check external links in changed files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          broken=0
          : > link-report.md
          for file in $(gh pr diff ${{ github.event.pull_request.number }} --name-only | grep '\.md$' || true); do
            [ -f "$file" ] || continue
            echo "Checking: $file"
            if ! markdown-link-check "$file" --quiet --config .github/workflows/link-check-config.json > out.txt 2>&1; then
              broken=$((broken + 1))
              { echo "## $file"; cat out.txt; echo; } >> link-report.md
            fi
          done
          if [ "$broken" -gt 0 ]; then
            echo "Broken links in $broken file(s)"
            cat link-report.md
            exit 1
          fi

      - name: Comment on PR with results
        if: failure() && hashFiles('link-report.md') != ''
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('link-report.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Link validation failed\n\n${report}\n\nFix the broken links before merging.`
            });

  check-ms-learn:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check internal links and anchors
        shell: pwsh
        run: ./.github/scripts/check-docs.ps1

      - name: Check Microsoft Learn URLs
        run: |
          grep -rhoE 'https://learn\.microsoft\.com[^) >"`]*' --include='*.md' . | sed 's/[,;.]*$//' | sort -u > urls.txt
          echo "# Microsoft Learn link status" > link-report.md
          echo "" >> link-report.md
          echo "Links checked: $(wc -l < urls.txt)" >> link-report.md
          broken=0
          while read -r url; do
            status=$(curl -o /dev/null -s -w "%{http_code}" -L "$url" || echo "000")
            if [ "$status" != "200" ]; then
              echo "- $status: \`$url\`" >> link-report.md
              broken=$((broken + 1))
            fi
          done < urls.txt
          echo "BROKEN_COUNT=$broken" >> "$GITHUB_ENV"

      - name: Create issue if broken links found
        if: env.BROKEN_COUNT != '0'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('link-report.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Documentation links need an update',
              body: `${report}\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['maintenance', 'documentation', 'broken-links']
            });