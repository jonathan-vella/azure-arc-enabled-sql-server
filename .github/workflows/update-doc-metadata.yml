name: Update Documentation Metadata

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '!.github/**'

permissions:
  contents: write

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update metadata in changed files
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # A new branch or force push has an all-zero or missing "before" commit.
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          else
            range="$AFTER~1..$AFTER"
          fi
          version="v1.$(date +%Y.%m)"
          today="$(date +%Y-%m-%d)"

          git diff --name-only --diff-filter=AM "$range" -- '*.md' ':!.github' | while IFS= read -r file; do
            [ -f "$file" ] || continue
            # Files with a non-v1 version (vendored upstream READMEs) do not match and stay unchanged.
            sed -i -E \
              -e "s/^Version: v1\.[0-9]{4}\.[0-9]{2}( *)$/Version: $version\1/" \
              -e "s/^Last updated: [0-9]{4}-[0-9]{2}-[0-9]{2}( *)$/Last updated: $today\1/" \
              "$file"
          done

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No metadata changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[skip ci] Update documentation metadata"
          git push